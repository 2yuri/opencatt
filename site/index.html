<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCatt</title>
    <meta
      name="description"
      content="Open source desktop app to write, approve and schedule your posts, with an AI agent that asks first."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e12;
        --text: #f2f2f5;
        --muted: #a1a1ad;
        --accent: #7c6cff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 560px;
        padding: 32px 16px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a.button {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .links {
        margin-top: 16px;
        font-size: 14px;
      }
      .links a {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenCatt</h1>
      <p>
        Write, approve and schedule your posts from your desktop, with an AI agent that asks first.
        Open source, local first, for macOS, Windows and Linux.
      </p>
      <a class="button" href="https://github.com/2yuri/opencatt/releases/latest">Download</a>
      <div class="links"><a href="https://github.com/2yuri/opencatt">Source on GitHub</a></div>
    </main>
  </body>
</html>
